workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic API Key   # must match the name you gave the key in App Store Connect API settings
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourcompany.smartstock   # replace with your actual bundle ID
      vars:
        APP_STORE_APPLE_ID: 1234567890       # replace with your app's Apple ID from App Store Connect
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Flutter build ipa
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1))
          flutter build ipa --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - keystore_reference   # name of the keystore you upload in Codemagic App settings > Code signing
      vars:
        PACKAGE_NAME: "com.yourcompany.smartstock"   # replace with your actual package name
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal